# nginx site for the backend API on the droplet.
# Install: /etc/nginx/sites-available/chat.api.suryathink.com (symlinked into
# sites-enabled), then run certbot to add HTTPS.

server {
  listen 80;
  listen [::]:80;
  server_name chat.api.suryathink.com;

  client_max_body_size 1m;

  # Streaming chat replies: pass tokens through immediately
  location = /chat/send/stream {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
