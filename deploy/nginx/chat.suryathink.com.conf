# nginx site for the React frontend on the droplet.
# Install: /etc/nginx/sites-available/chat.suryathink.com (symlinked into
# sites-enabled), then run certbot to add HTTPS.
# "current" is a symlink to the live release, switched by deploy-client.sh.

server {
  listen 80;
  listen [::]:80;
  server_name chat.suryathink.com;

  root /var/www/chat.suryathink.com/current;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Hashed build assets never change, so cache them for a year
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Always revalidate the entry page so new deploys show up immediately
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback: client-side routes like /c/123 are handled by React Router
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
