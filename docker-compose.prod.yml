# Production stack: optimized API build + nginx-served React build.
# Uses the MongoDB (e.g. Atlas) connection string from server/.env.
#   docker compose -f docker-compose.prod.yml up --build -d
# App: http://localhost:3000
name: ai-customer-support

services:
  server:
    build:
      context: ./server
      target: production
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  client:
    build:
      context: ./client
      target: production
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
