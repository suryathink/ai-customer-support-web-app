# Production stack: compiled API + nginx-served React build.
# MongoDB (e.g. Atlas) and other settings come from server/.env.
#   docker compose up --build
# App: http://localhost:3000
name: ai-customer-support

services:
  server:
    build: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
