# Development stack: local MongoDB + API + Vite dev server with hot reload.
#   docker compose up
# App: http://localhost:5173   API: http://localhost:5000
name: ai-customer-support-dev

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      target: development
    restart: unless-stopped
    # Values in server/.env (e.g. OPENROUTER_API_KEY) are loaded if the file exists
    env_file:
      - path: ./server/.env
        required: false
    environment:
      NODE_ENV: development
      PORT: 5000
      # Always use the bundled mongo container in development
      MONGO_URI: mongodb://mongo:27017/ai_support
      CLIENT_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
    ports:
      - "5000:5000"
    volumes:
      - ./server/src:/app/src
    # -L (polling) so file changes on Windows/macOS bind mounts are detected
    command: ["npx", "nodemon", "-L"]
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: ./client
      target: development
    restart: unless-stopped
    environment:
      VITE_DEV_API_PROXY: http://server:5000
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
    depends_on:
      - server

volumes:
  mongo-data:
