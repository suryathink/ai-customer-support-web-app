name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "deploy/deploy-server.sh"
      - ".github/workflows/deploy-server.yml"
  # Allows a manual re-deploy from the Actions tab
  workflow_dispatch:

# Never run two deploys at the same time
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE: suryathink/ai-customer-support-server

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The image build compiles the TypeScript, so a broken build fails here
      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to DigitalOcean Droplet
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$DROPLET_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$DROPLET_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy New Image
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "${DROPLET_USER}@${DROPLET_HOST}" \
            'bash -s' -- "${IMAGE}:sha-${GITHUB_SHA}" < deploy/deploy-server.sh

      - name: Remove SSH Key
        if: always()
        run: rm -f ~/.ssh/deploy_key
